[package]
name = "ai-os-control-center"
version = "0.6.2"
description = "AI OS Control Center - native shell around the system's technical passport"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde_json = "1"
chrono = "0.4"
urlencoding = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
