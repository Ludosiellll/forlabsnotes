<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Вход на сайт | Города Беларуси: Бобруйск</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 40px 20px;
            color: #1e293b;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header img {
            width: 65px;
            height: 80px;
            margin-bottom: 10px;
        }
        h2 {
            margin: 0 0 8px 0;
            color: #0f172a;
            font-size: 22px;
        }
        p.subtitle {
            margin: 0;
            color: #64748b;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .btn-submit {
            width: 100%;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #0369a1;
        }
        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }
        .footer-links a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="emblem.png" alt="Герб Бобруйска">
            <h2>Авторизация</h2>
            <p class="subtitle">Информационный портал «Города Беларуси: Бобруйск»</p>
        </div>

        <form action="/login" method="post">
            <div class="form-group">
                <label for="login">Логин или имя пользователя:</label>
                <input type="text" id="login" name="login" placeholder="Введите ваш логин" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required>
            </div>

            <button type="submit" class="btn-submit">Войти</button>
        </form>

        <div class="footer-links">
            <p>Нет учетной записи? <a href="register.html">Зарегистрироваться</a></p>
            <p><a href="test.html">Пройти краеведческий тест по Бобруйску →</a></p>
        </div>
    </div>

</body>
</html>
